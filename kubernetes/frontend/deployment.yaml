apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: musicrank
spec:
  replicas: 3 # bumped from 2 — Phase 6 scaling demonstration
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Reuses the same image docker-compose built — its VITE_*_API_URL
          # values were baked in at build time pointing at localhost:4001/
          # 4002, which still works here since vote-api/ranking-api's
          # Services below publish those same ports to the host.
          image: musicrank-frontend:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # Lighter than the Node services — nginx serving static files.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: musicrank
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 80
