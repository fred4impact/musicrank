apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: musicrank
spec:
  replicas: 3 # bumped from 2 — spec §22: "the worker can also be scaled independently"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: musicrank-worker:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090 # /metrics only (Phase 8) — still no real API
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: musicrank-secrets
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: musicrank-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # No readinessProbe — no Service routes traffic to these pods, so
          # there's nothing for readiness to gate. livenessProbe still makes
          # sense: if the metrics server is wedged, the process likely is
          # too, and Redis's BRPOP already guarantees no two replicas race
          # on the same event, so a restart here is always safe.
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            # Default timeoutSeconds (1s) was too tight here: /metrics does
            # an async Redis LLEN call (registerQueueSizeMetric), and under
            # concurrent scrape load from both this probe and Prometheus's
            # own 15s scrape interval, that occasionally pushed past 1s —
            # observed this for real as a liveness-triggered restart loop
            # with no actual error in the logs, just probe timeouts.
            timeoutSeconds: 5
