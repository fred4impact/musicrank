name: Build

on:
  push:
    branches: [master, feature]
  workflow_dispatch: {}

jobs:
  # Reuses test.yml's jobs directly — if any of them fail, this run fails
  # too and build-and-push below never starts (needs: test). Not a
  # convention, an actual gate: spec §29's pipeline is lint -> test -> build
  # -> docker build -> push, in that order.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [vote-api, ranking-api, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/musicrank-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/musicrank-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Deployment stays manual for now (spec §29: "For an initial implementation,
  # deployment can remain manual") — there's also no internet-reachable
  # cluster for a hosted runner to reach; this project's Kubernetes cluster
  # is local-only (see kubernetes/README.md). `kubectl apply -f kubernetes/`
  # against a real target cluster is the natural next automation step once
  # one exists.
