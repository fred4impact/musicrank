# Template only — DO NOT put real credentials in this file; it's committed
# to Git. Copy it to secrets.yaml (gitignored) and fill in real values, or
# generate directly:
#
#   kubectl create secret generic musicrank-secrets -n musicrank \
#     --from-literal=POSTGRES_USER=musicrank \
#     --from-literal=POSTGRES_PASSWORD=<real password> \
#     --from-literal=POSTGRES_DB=musicrank \
#     --from-literal=DATABASE_URL="postgres://musicrank:<real password>@postgres:5432/musicrank"
#
# POSTGRES_USER/PASSWORD/DB configure the Postgres server itself (consumed
# by the postgres StatefulSet). DATABASE_URL is what ranking-api and worker
# connect with — it has to be kept in sync with the three values above by
# hand, since our services take one connection-string env var rather than
# assembling it from parts at runtime.
apiVersion: v1
kind: Secret
metadata:
  name: musicrank-secrets
  namespace: musicrank
type: Opaque
stringData:
  POSTGRES_USER: musicrank
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: musicrank
  DATABASE_URL: "postgres://musicrank:changeme@postgres:5432/musicrank"
