apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: musicrank
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: musicrank-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              # Postgres refuses to initialize a data directory that isn't
              # empty — without the subPath, mounting the PVC straight at
              # .../data would put the volume's own lost+found dir there
              # and break first-boot initialization.
              subPath: pgdata
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "musicrank", "-d", "musicrank"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "musicrank", "-d", "musicrank"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init-scripts
          configMap:
            name: musicrank-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: musicrank
spec:
  # Cluster-internal only (spec §18) — no type: LoadBalancer/NodePort.
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
