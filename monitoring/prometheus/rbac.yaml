# Read-only access to discover scrape targets (pods/services/endpoints) via
# the Kubernetes API — this is what lets Prometheus auto-discover every pod
# carrying a prometheus.io/scrape: "true" annotation, instead of a
# hand-maintained target list. No write access of any kind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: musicrank
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: musicrank
