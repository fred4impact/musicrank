apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-api
  namespace: musicrank
spec:
  replicas: 3 # bumped from spec §22's initial 2 — Phase 6 scaling demonstration
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ranking-api
  template:
    metadata:
      labels:
        app: ranking-api
    spec:
      containers:
        - name: ranking-api
          image: musicrank-ranking-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: musicrank-secrets
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: musicrank-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ranking-api
  namespace: musicrank
spec:
  # Spec §18 allows internal-or-exposed; exposed here since the frontend
  # calls it directly from the browser, same reasoning as vote-api.
  type: LoadBalancer
  selector:
    app: ranking-api
  ports:
    - port: 4002
      targetPort: 4002
