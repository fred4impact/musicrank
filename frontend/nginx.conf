server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path that isn't a real
    # static file should still serve index.html so the app can take over.
    location / {
        try_files $uri /index.html;
    }
}
