apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: musicrank
spec:
  replicas: 3 # bumped from 2 — spec §22: "the worker can also be scaled independently"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: musicrank-worker:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: musicrank-secrets
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: musicrank-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # No readiness/liveness probes — no HTTP server to check against
          # (spec §20's health check requirement is API-scoped). Each
          # replica independently BRPOPs the same Redis list, so Redis
          # itself guarantees no two workers process the same event.
