apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: musicrank
spec:
  # Single instance — spec's §17 architecture diagram doesn't show multiple
  # redis pods either, and a naive multi-replica Deployment here wouldn't
  # actually cluster them (each would be an independent, empty queue).
  # Real HA Redis needs Sentinel/Cluster mode, out of scope for this project.
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: musicrank
spec:
  # Cluster-internal only (spec §18).
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
