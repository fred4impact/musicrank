apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: musicrank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Reuses the same image docker-compose built — its VITE_*_API_URL
          # values were baked in at build time pointing at localhost:4001/
          # 4002, which still works here since vote-api/ranking-api's
          # Services below publish those same ports to the host.
          image: musicrank-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: musicrank
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 80
