# Standard annotation-based pod discovery — any pod in the cluster with
# prometheus.io/scrape: "true" gets picked up automatically (see
# kubernetes/{vote-api,ranking-api,worker}/deployment.yaml's pod template
# annotations). No ServiceMonitor CRDs / Prometheus Operator — that's real
# overkill for 3 app services; plain Prometheus + Kubernetes SD covers this
# project's actual scope.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: musicrank
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["musicrank"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      - job_name: "kube-state-metrics"
        static_configs:
          - targets: ["kube-state-metrics:8080"]
